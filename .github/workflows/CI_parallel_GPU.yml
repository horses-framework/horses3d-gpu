name: CI PARALLEL (MPI) GPU

########################################################################
on:
  # Manual trigger only
  workflow_dispatch:

jobs:
  parallel-gpu-tests:
    # Uses self-hosted runner on nibbler cluster with GPU access
    name: Parallel GPU Tests (NVFORTRAN)
    runs-on: [self-hosted, nibbler, gpu]
    # Prevent runaway jobs from consuming cluster resources indefinitely
    timeout-minutes: 120

    # Run every step in a login shell so that "module" is defined;
    # -e keeps the default stop-on-first-error behaviour
    defaults:
      run:
        shell: bash -l -e {0}

    env:
      METIS_HOME: ${{ github.workspace }}/metis-5.1.0/build/Linux-x86_64

      # Cluster account the tests run as
      CI_USER: a.ballout

      # Set HOME explicitly: the runner is a systemd service and nvfortran
      # refuses to compile without it
      HOME: /home/a.ballout
    
    steps:
      - uses: actions/checkout@v4

      # Modules and compiler paths. Sourced by the build steps on nibbler
      # and by every SLURM batch script on the compute node.
      - name: Create environment script
        run: |
          cat > "$GITHUB_WORKSPACE/ci_env.sh" << 'ENV_EOF'
          module purge
          module load hpc_sdk
          module load nvhpc/24.11
          export NVHPC_CUDA_HOME=$NVHPC_ROOT/cuda
          export CUDA_HOME=$NVHPC_CUDA_HOME
          export CUDA_PATH=$NVHPC_CUDA_HOME
          export LD_LIBRARY_PATH=$NVHPC_ROOT/math_libs/12.6/targets/x86_64-linux/lib:$NVHPC_CUDA_HOME/lib64:$LD_LIBRARY_PATH
          export LIBRARY_PATH=$NVHPC_ROOT/math_libs/12.6/targets/x86_64-linux/lib:$NVHPC_CUDA_HOME/lib64:$LIBRARY_PATH
          export NVCOMPILER_COMM_LIBS_HOME=$NVHPC_ROOT/comm_libs/12.6
          export OPAL_PREFIX=$NVHPC_ROOT/comm_libs/mpi
          ENV_EOF
          chmod +x "$GITHUB_WORKSPACE/ci_env.sh"

      # Submits one test, waits for it, prints its log and fails the step
      # if the test failed. Used by every test step below.
      # Both this script and the batch script it writes start with
      # "#!/bin/bash -l", a login shell, so that "module" exists here and on
      # the compute node. A comment cannot go on a "#!" line itself.
      # The job is submitted with --uid so it runs as the cluster account
      # rather than as root.
      - name: Create test runner script
        run: |
          cat > "$GITHUB_WORKSPACE/ci_run_slurm_test.sh" << 'RUNNER_EOF'
          #!/bin/bash -l
          # Usage: ci_run_slurm_test.sh <job name> <command to run on the compute node>
          set -e   # stop at the first failing command, as the workflow shell does

          job_name="$1"
          shift
          test_cmd="$*"

          source "$GITHUB_WORKSPACE/ci_env.sh"

          cat > run_test.sh << SBATCH_EOF
          #!/bin/bash -l
          #SBATCH --job-name=${job_name}
          #SBATCH --ntasks=2
          #SBATCH --mem=32G
          #SBATCH --partition=gpu
          #SBATCH --gres=gpu:2   # number of gpus max 4
          #SBATCH --time=00:15:00

          source "$GITHUB_WORKSPACE/ci_env.sh"
          ${test_cmd}
          SBATCH_EOF

          job_id=$(sbatch --uid=$CI_USER --parsable run_test.sh)
          while squeue -j $job_id 2>/dev/null | grep -q $job_id; do sleep 10; done

          cat slurm-${job_id}.out

          # Check exit code (ExitCode:Signal, e.g., "0:0" means success)
          exit_code=$(sacct -j $job_id --format=ExitCode --noheader | head -1 | tr -d ' ' | cut -d':' -f1)
          if [ "$exit_code" != "0" ]; then
            echo "Test failed with exit code: $exit_code"
            exit 1
          fi
          RUNNER_EOF
          chmod +x "$GITHUB_WORKSPACE/ci_run_slurm_test.sh"


      # Install METIS library (required for parallel partitioning)
      - name: Install METIS
        run: |
          source "$GITHUB_WORKSPACE/ci_env.sh"
          module load cmake
          
          if [ ! -d "metis-5.1.0" ]; then
            wget "https://src.fedoraproject.org/lookaside/pkgs/metis/metis-5.1.0.tar.gz/5465e67079419a69e0116de24fce58fe/metis-5.1.0.tar.gz" 
            tar -xvf metis-5.1.0.tar.gz
            cd metis-5.1.0
            # Update CMake minimum required version to 3.5
            sed -i 's/cmake_minimum_required(VERSION [0-9.]\+)/cmake_minimum_required(VERSION 3.5)/' CMakeLists.txt
            make config cc=gcc
            make
            mkdir -p build/Linux-x86_64/lib build/Linux-x86_64/bin
            cp -r build/Linux-x86_64/libmetis/* build/Linux-x86_64/lib/ 2>/dev/null || true
            cp -r build/Linux-x86_64/programs/* build/Linux-x86_64/bin/ 2>/dev/null || true
          fi

      - name: Configure Horses3D
        run: |
          source "$GITHUB_WORKSPACE/ci_env.sh"
          cd Solver
          ./configure

      - name: Compile horses3d
        working-directory: ./Solver
        run: |
          source "$GITHUB_WORKSPACE/ci_env.sh"
          make allclean COMPILER=nvfortran COMM=PARALLEL ENABLE_THREADS=NO WITH_METIS=YES
          make ns ins mu COMPILER=nvfortran COMM=PARALLEL ENABLE_THREADS=NO WITH_METIS=YES

      # Hand the whole workspace to the cluster account before any test runs:
      # the checkout and the builds above are done by root, and the SLURM jobs
      # run as a.ballout.
      - name: Fix workspace ownership
        run: sudo chown -R "$CI_USER:$CI_USER" $GITHUB_WORKSPACE

#
# UNIT TESTS: WALL SHEAR STRESS (|tau_vector| vs. tau, |u_tau_vector| vs. u_tau)
# -----------------------------------------------------------------------------

      - name: Build unit test WallShearStress
        working-directory: ./Solver/test/Components/WallShearStress
        run: |
          source "$GITHUB_WORKSPACE/ci_env.sh"
          make unittest COMPILER=nvfortran COMM=PARALLEL ENABLE_THREADS=NO WITH_METIS=YES
        if: '!cancelled()'

      - name: Run unit test WallShearStress
        working-directory: ./Solver/test/Components/WallShearStress
        run: $GITHUB_WORKSPACE/ci_run_slurm_test.sh UnitTestWallShearStress_Parallel ./bin/TestWallShearStress
        if: '!cancelled()'

#
# HORSES2PLT: WALL SHEAR STRESS VECTOR (u_tau_x/y/z, tau, tau_x/y/z)
# Same checks as CI_horses2plt.yml (CPU): generate surface solution with
# "surface save utau/utau vector/turbulent", convert it and check
# |u_tau_vector| = u_tau, tau = rho u_tau^2, tau_i = rho u_tau u_tau_i, |tau_vector| = tau
# -----------------------------------------------------------------------------

      - name: Build horses2plt
        working-directory: ./Solver
        run: |
          source "$GITHUB_WORKSPACE/ci_env.sh"
          make addons ADDONS=horses2tecplot COMPILER=nvfortran COMM=PARALLEL ENABLE_THREADS=NO WITH_METIS=YES
        if: '!cancelled()'

      - name: Run NS Cylinder (surface wall variables) for horses2plt
        working-directory: ./Solver/test/AddOns/horses2plt
        run: |
          mkdir -p MESH RESULTS/surfaces
          ln -sf ../../../bin/horses3d.ns horses3d.ns
          ln -sf ../../../bin/horses2plt horses2plt
          $GITHUB_WORKSPACE/ci_run_slurm_test.sh HORSES2PLT_Parallel mpirun -np 1 --bind-to none ./horses3d.ns Cylinder.control
        if: '!cancelled()'

      - name: horses2plt - surface wall shear stress vector (u_tau_vector, tau, tau_x/y/z)
        working-directory: ./Solver/test/AddOns/horses2plt
        run: |
          source "$GITHUB_WORKSPACE/ci_env.sh"
          ulimit -s unlimited
          for conv in surface_wall surface_wall_vector surface_wall_vector_dimensionless; do
            rm -f RESULTS/surfaces/Cylinder_bc001_0000000020.surf.tec
            ./horses2plt convert/$conv.convert
            ./check_tec.sh RESULTS/surfaces/Cylinder_bc001_0000000020.surf.tec QUADRILATERAL +u_tau +tau +rho
            if [ "$conv" != "surface_wall" ]; then
              ./check_tec.sh RESULTS/surfaces/Cylinder_bc001_0000000020.surf.tec QUADRILATERAL u_tau_x u_tau_y u_tau_z tau_x tau_y tau_z
              python3 check_wall_shear.py RESULTS/surfaces/Cylinder_bc001_0000000020.surf.tec 1.0e-4
            fi
          done
        if: '!cancelled()'

      - name: Run NS Cylinder (signed u_tau) for horses2plt
        working-directory: ./Solver/test/AddOns/horses2plt
        run: $GITHUB_WORKSPACE/ci_run_slurm_test.sh HORSES2PLT_Sign_Parallel mpirun -np 1 --bind-to none ./horses3d.ns CylinderSign.control
        if: '!cancelled()'

      - name: horses2plt - signed wall shear stress, tau = tau_vector . t3 (normal from the surface mesh)
        working-directory: ./Solver/test/AddOns/horses2plt
        run: |
          source "$GITHUB_WORKSPACE/ci_env.sh"
          ulimit -s unlimited
          rm -f RESULTS/surfaces/CylinderSign_bc001_0000000020.surf.tec
          ./horses2plt convert/surface_wall_vector_sign.convert
          ./check_tec.sh RESULTS/surfaces/CylinderSign_bc001_0000000020.surf.tec QUADRILATERAL +u_tau u_tau_x u_tau_y u_tau_z +tau tau_x tau_y tau_z +rho
          python3 check_wall_shear.py RESULTS/surfaces/CylinderSign_bc001_0000000020.surf.tec 1.0e-4 --signed --order 3 --aoa 0 90
        if: '!cancelled()'

