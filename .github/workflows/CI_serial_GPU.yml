#
# 1) CYLINDER
# -----------

      - name: Build NSCylinder
        working-directory: ./Solver/test/NavierStokes/Cylinder/SETUP
        run: |
          source "$GITHUB_WORKSPACE/ci_env.sh"
          make clean || true
          make ns COMPILER=nvfortran COMM=SERIAL ENABLE_THREADS=NO
        if: '!cancelled()'


      - name: Run NSCylinder
        working-directory: ./Solver/test/NavierStokes/Cylinder
        run: $GITHUB_WORKSPACE/ci_run_slurm_test.sh NSCylinder_Serial ./horses3d.ns Cylinder.control
        if: '!cancelled()'

