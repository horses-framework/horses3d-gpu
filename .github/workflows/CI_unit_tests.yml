name: CI UNIT TESTS

########################################################################
# Lightweight CPU unit tests (GitHub-hosted runner, gfortran, serial).
# They only need the Navier-Stokes libraries, so they run on every push
# and pull request, independently of the self-hosted GPU runners.
########################################################################
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit Tests (GFORTRAN, SERIAL)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          gfortran --version

      - name: Configure Horses3D
        working-directory: ./Solver
        run: ./configure

      - name: Compile Navier-Stokes libraries
        working-directory: ./Solver
        run: make ns COMPILER=gfortran COMM=SERIAL ENABLE_THREADS=NO

########################################################################
#######                        UNIT TESTS                       ########
########################################################################

#
# 1) WALL SHEAR STRESS: |tau_vector| vs. tau, |u_tau_vector| vs. u_tau
# --------------------------------------------------------------------

      - name: Build WallShearStress
        working-directory: ./Solver/test/Components/WallShearStress
        run: make COMPILER=gfortran

      - name: Run WallShearStress
        working-directory: ./Solver/test/Components/WallShearStress
        run: make run COMPILER=gfortran
