#
# CHECK CODE COVERAGE
# -------------------------

      - name: Install gcovr
        if: matrix.mode == 'DEBUG' && !cancelled()
        run: |
          sudo apt-get update
          sudo apt-get install -y gcovr

      - name: Generate Coverage Report
        if: matrix.mode == 'DEBUG' && !cancelled()
        run: |
          # gcovr scans recursively from the root to find all generated .gcda and .gcno files
          gcovr --root . --print-summary --xml coverage.xml

      - name: Upload Coverage to Codecov
        if: matrix.mode == 'DEBUG' && !cancelled()
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          use_oidc: true