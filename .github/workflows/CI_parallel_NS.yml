# This is a basic workflow to help you get started with Actions

name: CI PARALLEL (MPI) NS

########################################################################
# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  # Comment lines 10-13 to deactivate automatic running until Metis webpage is online again.
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Permissions for codecov
    permissions:
      id-token: write
      contents: read

    # Define strategy matrix
    strategy:
      fail-fast: false
      matrix:
        compiler: ['gfortran']
        mode: ['DEBUG']
        comm: ['PARALLEL']
        enable_threads: ['NO']
        mkl: ['NO']
        hdf5: ['YES']
        
    name: NS - ${{ matrix.compiler }} - ${{ matrix.mode }} - ${{ matrix.comm }} - OpenMP = ${{ matrix.enable_threads }}
    
    env:
      METIS_HOME:  /home/runner/work/horses3d-gpu/horses3d-gpu/metis-5.1.0/build/Linux-x86_64
      # INTEL_COMPILER_DIR : /opt/intel/oneapi/compiler/2024.1
    # Steps represent a sequence of tasks that will be executed as part of the job

    steps:
      - uses: actions/checkout@v3

      - name: Set Coverage Flags
        run: |
          if [ "${{ matrix.mode }}" = "DEBUG" ]; then
            echo "EXTRA_COV=-Og -fprofile-arcs -ftest-coverage" >> $GITHUB_ENV
          else
            echo "EXTRA_COV=" >> $GITHUB_ENV
          fi

      # Install OpenMPI (gfortran case)
      - name: Install OpenMPI
        if: (matrix.compiler == 'gfortran')
        run: |
          sudo apt-get install -y openmpi-bin libopenmpi-dev
          export OMPI_FCFLAGS="-DOMPI_SKIP_MPIF08" # deactivate mpi_f08 interface to avoid compilation problems
          mpif90 --version
          mpif90 --showme
          mpicc --version
          mpicc --showme
          mpicxx --version
          mpicxx --showme
          mpirun --version
          mpiexec --version
          mpifort --version
          mpifort --showme
          gcc --version

      # # Install parallel HDF5 (OpenMPI version)
      # - name: Install HDF5 (parallel, OpenMPI)
      #   if: (matrix.compiler == 'gfortran')
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y libhdf5-openmpi-dev
      #     dpkg -L libhdf5-openmpi-dev
      #     echo "HDF5_ROOT=/usr/lib/x86_64-linux-gnu/hdf5/openmpi/" >> $GITHUB_ENV
          
      - name: Install HDF5 (gnu)
        if: (matrix.compiler == 'gfortran') 
        run: |
          export OMPI_FCFLAGS="-DOMPI_SKIP_MPIF08" # deactivate mpi_f08 interface to avoid compilation problems
          wget "https://support.hdfgroup.org/ftp/HDF5/releases/hdf5-1.12/hdf5-1.12.0/src/hdf5-1.12.0.tar.gz"
          tar -xvf hdf5-1.12.0.tar.gz
          cd hdf5-1.12.0
          ./configure --enable-parallel --enable-fortran CC=mpicc FC=mpif90 CXX=mpicxx
          make -j8 install
          echo "HDF5_ROOT=$PWD/hdf5" >> $GITHUB_ENV
          echo "HDF5_DIR=$PWD/hdf5" >> $GITHUB_ENV
          ./hdf5/bin/h5pfc -show
      - name: Check HDF5 PATH
        run: echo "HDF5_ROOT=$HDF5_ROOT"

      # IF COMPILER = IFORT -> INSTALL IFORT #
      # UNCOMMENT TO USE CACHED IFORT 
      #- name: cache-intel-compilers
      #  if: (matrix.compiler == 'ifort')
      #  id: cache-intel-compilers
      #  uses: actions/cache@v3
      #  with:
      #    path: /opt/intel
      #    key: intel-${{ runner.os }}-compilers-b

      # - name: Intel Apt repository
      # # UNCOMMENT TO USE CACHED IFORT 
      # #  if: (steps.cache-intel-compilers.outputs.cache-hit != 'true')
      #   run: |
      #     wget https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
      #     sudo apt-key add GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
      #     sudo add-apt-repository "deb https://apt.repos.intel.com/oneapi all main"
      #     sudo apt-get update

      # - name: Install Intel oneAPI
      # # UNCOMMENT TO USE CACHED IFORT
      # #  if: (steps.cache-intel-compilers.outputs.cache-hit != 'true')
      #   run: sudo apt-get install intel-oneapi-compiler-fortran intel-oneapi-compiler-dpcpp-cpp intel-oneapi-mpi intel-oneapi-mpi-devel intel-oneapi-mkl-devel ninja-build

      # # - name: cache-metis
      # #   id: cache-metis
      # #   uses: actions/cache@v2
      # #   with:
      # #     path: /home/runner/metis-5.1.0
      # #     key: metis-${{ runner.os }}-b

      - name: Install METIS (intel)
        # if: (steps.cache-metis.outputs.cache-hit != 'true')
        # wget "http://glaros.dtc.umn.edu/gkhome/fetch/sw/metis/metis-5.1.0.tar.gz" (OLD LINK TO METIS)
        if: (matrix.compiler == 'ifort') 
        run: |
          # source /opt/intel/oneapi/setvars.sh || true
          wget "https://src.fedoraproject.org/lookaside/pkgs/metis/metis-5.1.0.tar.gz/5465e67079419a69e0116de24fce58fe/metis-5.1.0.tar.gz" 
          tar -xvf metis-5.1.0.tar.gz
          cd metis-5.1.0
          make config cc=icx
          make
          mv /home/runner/work/horses3d-gpu/horses3d-gpu/metis-5.1.0/build/Linux-x86_64/libmetis /home/runner/work/horses3d-gpu/horses3d-gpu/metis-5.1.0/build/Linux-x86_64/lib
          mv /home/runner/work/horses3d-gpu/horses3d-gpu/metis-5.1.0/build/Linux-x86_64/programs /home/runner/work/horses3d-gpu/horses3d-gpu/metis-5.1.0/build/Linux-x86_64/bin
#          export METIS_HOME=~/metis-5.1.0/build/Linux-x86_64
#          echo $METIS_HOME

      - name: Install METIS (gnu)
      # if: (steps.cache-metis.outputs.cache-hit != 'true')
      # wget "http://glaros.dtc.umn.edu/gkhome/fetch/sw/metis/metis-5.1.0.tar.gz" (OLD LINK TO METIS)
        if: (matrix.compiler == 'gfortran') 
        run: |
          export OMPI_FCFLAGS="-DOMPI_SKIP_MPIF08" # deactivate mpi_f08 interface to avoid compilation problems
          wget "https://src.fedoraproject.org/lookaside/pkgs/metis/metis-5.1.0.tar.gz/5465e67079419a69e0116de24fce58fe/metis-5.1.0.tar.gz" 
          tar -xvf metis-5.1.0.tar.gz
          cd metis-5.1.0
          make config cc=gcc
          make
          mv /home/runner/work/horses3d-gpu/horses3d-gpu/metis-5.1.0/build/Linux-x86_64/libmetis /home/runner/work/horses3d-gpu/horses3d-gpu/metis-5.1.0/build/Linux-x86_64/lib
          mv /home/runner/work/horses3d-gpu/horses3d-gpu/metis-5.1.0/build/Linux-x86_64/programs /home/runner/work/horses3d-gpu/horses3d-gpu/metis-5.1.0/build/Linux-x86_64/bin

      - name: Check METIS PATH
        run: echo $METIS_HOME

      # Runs a single command using the runners shell
      ##- name: Install gfortran
      ##  run: |
      ##   sudo add-apt-repository ppa:ubuntu-toolchain-r/test
      ##   sudo apt update
      ##   sudo apt-get install gfortran-9

      ##- name: Show gfortran version
      ##  run: gfortran-9 --version
      - name: Show ${{matrix.compiler}} version
        run: |
          # source /opt/intel/oneapi/setvars.sh || true
          ${{matrix.compiler}} --version

      - name: Configure
        working-directory: ./Solver
        run: ./configure

      - name: Compile horses3d
        working-directory: ./Solver
        run: |
         export OMPI_FCFLAGS="-DOMPI_SKIP_MPIF08" # deactivate mpi_f08 interface to avoid compilation problems
          
         # Compile the code
         make allclean MODE=${{matrix.mode}} COMPILER=${{matrix.compiler}} COMM=${{matrix.comm}} ENABLE_THREADS=${{matrix.enable_threads}} WITH_METIS=YES WITH_MKL=${{matrix.mkl}} WITH_HDF5=${{matrix.hdf5}} EXTRA_FFLAGS="${{ env.EXTRA_COV }}" EXTRA_LDFLAGS="$EXTRA_LINK_FLAGS"
         make ns MODE=${{matrix.mode}} COMPILER=${{matrix.compiler}} COMM=${{matrix.comm}} ENABLE_THREADS=${{matrix.enable_threads}} WITH_METIS=YES WITH_MKL=${{matrix.mkl}} WITH_HDF5=${{matrix.hdf5}} EXTRA_FFLAGS="${{ env.EXTRA_COV }}"
          
         cp -r $HDF5_ROOT/lib/* lib/ # Copy hdf5 libraty files to local lib
         ldd ./bin/horses3d.ns


#
# UNIT TESTS: WALL SHEAR STRESS (|tau_vector| vs. tau, |u_tau_vector| vs. u_tau)
# -----------------------------------------------------------------------------

      - name: Build unit test WallShearStress
        working-directory: ./Solver/test/Components/WallShearStress
        run: |
         export OMPI_FCFLAGS="-DOMPI_SKIP_MPIF08" # deactivate mpi_f08 interface to avoid compilation problems
         make unittest MODE=${{matrix.mode}} COMPILER=${{matrix.compiler}} COMM=${{matrix.comm}} ENABLE_THREADS=${{matrix.enable_threads}} WITH_METIS=YES WITH_MKL=${{matrix.mkl}} WITH_HDF5=${{matrix.hdf5}} EXTRA_FFLAGS="${{ env.EXTRA_COV }}"
        if: '!cancelled()'

      - name: Run unit test WallShearStress
        working-directory: ./Solver/test/Components/WallShearStress
        run: |
         export OMPI_FCFLAGS="-DOMPI_SKIP_MPIF08" # deactivate mpi_f08 interface to avoid compilation problems
         make run-unittest MODE=${{matrix.mode}} COMPILER=${{matrix.compiler}} COMM=${{matrix.comm}} ENABLE_THREADS=${{matrix.enable_threads}} WITH_METIS=YES WITH_MKL=${{matrix.mkl}} WITH_HDF5=${{matrix.hdf5}} EXTRA_FFLAGS="${{ env.EXTRA_COV }}"
        if: '!cancelled()'

